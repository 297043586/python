<div class="modal-overlay" id="pwModal">
  <div class="modal-content small" style="max-width:460px;">
    <div class="modal-header">
      <h2 style="margin:0;font-size:18px;">修改口令</h2>
      <button class="modal-close" onclick="closePassword()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="notice" id="pwNotice"></div>
      <label style="font-size:12.5px;color:var(--fg-dim);">原口令</label>
      <input id="pwOld" type="password" style="width:100%;padding:8px 10px;border:1px solid var(--input-border);border-radius:6px;margin-bottom:12px;background:var(--card-bg);color:var(--fg);">
      <label style="font-size:12.5px;color:var(--fg-dim);">新口令 (至少 8 位)</label>
      <input id="pwNew" type="password" style="width:100%;padding:8px 10px;border:1px solid var(--input-border);border-radius:6px;margin-bottom:16px;background:var(--card-bg);color:var(--fg);">
      <button class="hbtn" onclick="savePassword()">保存</button>
    </div>
  </div>
</div>
