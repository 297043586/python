<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 局域网监控</title>
<style>
body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#1e293b,#0f172a); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.box { background:#fff; padding:36px 40px; border-radius:14px; width:340px; box-shadow:0 20px 40px rgba(0,0,0,.3); }
h1 { margin:0 0 6px; font-size:19px; color:#0f172a; }
p.sub { margin:0 0 22px; font-size:12.5px; color:#64748b; }
label { display:block; font-size:13px; color:#475569; margin:14px 0 6px; }
input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:7px; font-size:14px; box-sizing:border-box; }
input:focus { outline:none; border-color:#2563eb; }
button { width:100%; margin-top:22px; padding:11px; background:#2563eb; color:#fff; border:0;
  border-radius:7px; font-size:15px; font-weight:600; cursor:pointer; }
button:disabled { background:#94a3b8; cursor:not-allowed; }
.err { margin-top:14px; color:#991b1b; background:#fee2e2; padding:9px 12px; border-radius:6px; font-size:13px; display:none; }
a.back { display:block; text-align:center; margin-top:16px; font-size:12.5px; color:#64748b; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>🔐 局域网监控</h1>
  <p class="sub">查看仪表盘不需要登录; 增删设备等操作需要管理员身份</p>
  <label>用户名</label>
  <input id="u" autocomplete="username" autofocus>
  <label>口令</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="btn" onclick="doLogin()">登 录</button>
  <div class="err" id="err"></div>
  <a class="back" href="/">← 返回仪表盘(无需登录即可查看)</a>
</div>
<script>
function byId(i) { return document.getElementById(i); }
function doLogin() {
  var btn = byId('btn'), err = byId('err');
  btn.disabled = true; err.style.display = 'none';
  fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: byId('u').value, password: byId('p').value })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (res.ok) { location.href = '/'; return; }
      err.innerText = res.d.error || '登录失败'; err.style.display = 'block'; btn.disabled = false;
    }).catch(function () {
      err.innerText = '网络错误, 请重试'; err.style.display = 'block'; btn.disabled = false;
    });
}
document.addEventListener('keydown', function (e) { if (e.key === 'Enter') { doLogin(); } });
</script>
</body>
</html>
